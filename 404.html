<style>
@font-face{font-family:'Libre Baskerville';font-style:normal;font-weight:400 700;font-display:swap;src:url(/docs/polices/libre-baskerville-normal-variable.woff2) format('woff2');}
@font-face{font-family:'Work Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(/docs/polices/work-sans-normal-variable.woff2) format('woff2');}

:root{
  --hd:#187a9d;--hd-dark:#11536c;--sand:#e8cba6;
  --ink:#16323d;--muted:#55666d;--accent:#1d87ad;--navy:#16465a;
  --paper:#f6efe7;--border:#e3e8ea;
  --f-title:'Libre Baskerville',Georgia,serif;--f-body:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:clamp(14px,1.1vw,18px);}
body{min-height:100vh;display:flex;flex-direction:column;background:#fff;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;text-size-adjust:100%;}

/* Bandeau : même présentation que le haut du site */
.top{background:var(--hd);border-bottom:3px solid var(--sand);padding:16px 20px 14px;text-align:center;}
.top a{display:inline-block;color:#fff;text-decoration:none;}
.top .name{display:block;font-family:var(--f-title);font-size:clamp(1.35rem,4.6vw,1.7rem);line-height:1.15;letter-spacing:.01em;}
.top .sub{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--sand);}
.top .sub sup{font-size:.75em;line-height:0;}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,64px) 20px;}
.card{width:100%;max-width:640px;background:var(--paper);border-radius:10px;padding:clamp(28px,5vw,48px) clamp(20px,5vw,48px) clamp(32px,5vw,52px);text-align:center;animation:up .8s cubic-bezier(.22,.61,.36,1) both;}
.art{display:block;width:min(100%,300px);height:auto;margin:0 auto 6px;}
.art .code{font-family:var(--f-title);font-weight:700;}
h1{font-family:var(--f-title);font-weight:400;font-size:clamp(1.45rem,4.4vw,1.9rem);line-height:1.3;color:var(--navy);margin-bottom:12px;}
p{max-width:46ch;margin:0 auto;color:var(--muted);font-size:.95rem;}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px;}
.btn{display:inline-block;padding:13px 26px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.04em;transition:background .25s,color .25s,border-color .25s,transform .25s;}
.btn:hover,.btn:focus-visible{background:var(--navy);border-color:var(--navy);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--accent);}
.btn.ghost:hover,.btn.ghost:focus-visible{background:var(--navy);border-color:var(--navy);color:#fff;}

footer{padding:18px 20px 26px;text-align:center;font-size:12.5px;color:var(--muted);}

@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.card{animation:none;}.btn{transition:none;}}
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="Isabelle Goupil, retour à l'accueil">
    <span class="name">Isabelle Goupil</span>
    <span class="sub">Sage-femme conventionnée · Paris 7<sup>e</sup></span>
  </a>
</header>

<main>
  <div class="card">
    <svg class="art" viewBox="0 0 300 230" role="img" aria-label="Erreur 404">
      <defs>
        <g id="sprig">
          <path d="M0 0C3-34-3-70 4-112" fill="none" stroke="#4f7d5f" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="11" cy="-22" rx="4.6" ry="11" transform="rotate(38 11 -22)" fill="#8fb08f"/>
          <ellipse cx="-10" cy="-38" rx="4.6" ry="11" transform="rotate(-38 -10 -38)" fill="#6b9071"/>
          <ellipse cx="11" cy="-56" rx="4.6" ry="11" transform="rotate(38 11 -56)" fill="#6b9071"/>
          <ellipse cx="-9" cy="-74" rx="4.4" ry="10.5" transform="rotate(-38 -9 -74)" fill="#8fb08f"/>
          <ellipse cx="11" cy="-92" rx="4.2" ry="10" transform="rotate(38 11 -92)" fill="#8fb08f"/>
          <ellipse cx="5" cy="-114" rx="3.8" ry="9" transform="rotate(8 5 -114)" fill="#6b9071"/>
        </g>
      </defs>
      <circle cx="150" cy="112" r="100" fill="#f4d9c4"/>
      <circle cx="150" cy="112" r="74" fill="#faeadd"/>
      <use href="#sprig" transform="translate(36 214)"/>
      <use href="#sprig" transform="translate(264 214) scale(-1 1)"/>
      <text class="code" x="150" y="134" text-anchor="middle" font-size="62" fill="#11536c">404</text>
    </svg>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Vous pouvez revenir à l'accueil ou prendre rendez-vous directement en ligne.</p>
    <div class="actions">
      <a class="btn" href="/">Retour à l'accueil</a>
      <a class="btn ghost" href="https://www.doctolib.fr/sage-femme/paris/isabelle-goupil" target="_blank" rel="noopener">Prendre rendez-vous</a>
    </div>
  </div>
</main>

<footer>21 rue Chevert · 75007 Paris</footer>
</body>
</html>
